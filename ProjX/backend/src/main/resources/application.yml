spring:
  application:
    name: ecodelivery
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecodelivery}
    username: ${DB_USER:ecodelivery}
    password: ${DB_PASSWORD:ecodelivery}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

ecodelivery:
  geocoding:
    base-url: https://nominatim.openstreetmap.org
  # Rules of use (PolicyService). Placeholder values: to be confirmed by the Product Owner.
  policy:
    min-battery-level: 20
    max-reservation-duration: PT4H
    deposit-amount: 10.00
    overtime-rate-per-minute: 0.10
    max-active-reservations-per-courier: 1
