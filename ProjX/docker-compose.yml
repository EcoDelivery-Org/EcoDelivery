services:
  # Database: PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: ecodelivery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecodelivery
      POSTGRES_USER: ecodelivery
      POSTGRES_PASSWORD: ecodelivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecodelivery -d ecodelivery"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecodelivery-net

  # Backend: Spring Boot application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecodelivery-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/ecodelivery
      DB_USER: ecodelivery
      DB_PASSWORD: ecodelivery
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecodelivery-net

  # Frontend: Nginx web server & reverse proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecodelivery-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ecodelivery-net

volumes:
  postgres_data:

networks:
  ecodelivery-net:
    driver: bridge
