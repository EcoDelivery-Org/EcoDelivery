#Basic ci routine job: verifies only structure
name: EcoDelivery CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository files
        run: |
          test -f README.md
          test -f AGENTS.md

      - name: Confirm CI execution
        run: echo "EcoDelivery initial CI passed"
